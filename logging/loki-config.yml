# Single-binary Loki, filesystem storage. Not for production use.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  # Logs from the pais container can predate the first promtail start;
  # don't reject them just for being old.
  reject_old_samples: false
  allow_structured_metadata: true
  # Keep 14 days.
  retention_period: 336h
  # pais (IDM/AM debug logging) produces very large lines and high volume;
  # defaults (256KB lines, 4MB/s) reject them.
  max_line_size: 10MB
  ingestion_rate_mb: 30
  ingestion_burst_size_mb: 60

ingester:
  # Accept entries up to 24h old (default 2h would drop older backfill
  # from pais with "entry too far behind").
  max_chunk_age: 24h

analytics:
  reporting_enabled: false
