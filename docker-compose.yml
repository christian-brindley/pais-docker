services:
  pais:
    container_name: pais
    build: docker-build
    cap_add:
      - NET_ADMIN
    ports:
      - 443:8443
    extra_hosts:
      - "ds=127.0.0.1"
      - "am=127.0.0.1"
      - "idm=127.0.0.1"
    volumes:
      - ./data/ds:/var/ping/ds/data
      - ./config/idm:/opt/ping/idm/conf
      - ./config/idm-resolver:/opt/ping/idm/resolver
      - ./config/am:/opt/ping/am/config
    environment:
      IDM_RS_CLIENT_SECRET: "password"
      IDM_DS_BIND_PASSWORD: "password"
      AM_ENCRYPTION_KEY: "password"
      AGENT_SECRET: "password"
      SOFTHSM_PIN: "password"
      IG_OPTS: "-Dig.pid.file.mode=override"
      IAM_FQDN: "pais.local"
      IAM_REALM: "alpha"
      KEYSTORE_PASSWORD: "password"
      IG_CLIENT_ID: "ig-client"
      IG_CLIENT_SECRET: "password"
      IDM_SERVICE_ACCOUNT_USERNAME: "service_account.idm"
      IDM_SERVICE_ACCOUNT_PASSWORD: "0penB@nking!"
      CLIENT_SECRET_ID: "cGFzc3dvcmQ="
      JWT_ENCRYPTION_KEY: "wF+JJEI2PZtUsWGyO9+Weqhb/WzmNEFSYISD3BXmZR4="
      JWTSESSION_SYMMETRIC_SECRET_ID: "xYt3nAzdp3ML3c7bC9DoB3A0FLuWOJobFNqeWdNdWQqDEBWFcx8PToFusquhsb9phDPYq+Qx1vANT1quXgd/8g=="

  loki:
    container_name: loki
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./config/logging/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - logging

  promtail:
    container_name: promtail
    image: grafana/promtail:3.4.0
    volumes:
      - ./config/logging/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/positions
    networks:
      - logging
    depends_on:
      - loki

  grafana:
    container_name: grafana
    image: grafana/grafana:11.5.2
    ports:
      - "3030:3000"
    volumes:
      - ./config/logging/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    networks:
      - logging

volumes:
  loki-data:
  promtail-positions:
  grafana-data:

networks:
  logging:
